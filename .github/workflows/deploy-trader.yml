# Manual deploy only — does NOT run on push.
# Deploys Cloud Run Job + HTTP Service (status/control API) via WIF.
name: deploy-trader

on:
  workflow_dispatch:
    inputs:
      run_probe:
        description: "After deploy, execute job once in probe mode"
        type: boolean
        default: false
      run_futures_probe:
        description: "After deploy, execute job once in futures-probe mode (Demo USD-M)"
        type: boolean
        default: false
      run_futures_order_probe:
        description: "After deploy, execute job once in futures-order-probe (order/test, no fills)"
        type: boolean
        default: false
      run_once:
        description: "After deploy, execute job once (uses TRADER_MODE)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-east1
  JOB_NAME: crypto-trader
  SERVICE_NAME: crypto-trader-api
  SCHEDULER_HOURLY: crypto-trader-hourly
  SCHEDULER_DAILY_SOL: crypto-trader-daily-sol
  REPO_NAME: trader
  IMAGE_NAME: crypto-trader
  CORS_ORIGIN: https://robinjfor.github.io
  PIN_SALT: crypto-trader-v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: service
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/${REPO_NAME}/${IMAGE_NAME}"
          TAG="${GITHUB_SHA::12}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_URI=${IMAGE}:${TAG}" >> "$GITHUB_ENV"

      - name: Resolve trader mode + PIN hash
        id: mode
        env:
          TRADER_CONTROL_PIN: ${{ secrets.TRADER_CONTROL_PIN }}
          SESSION_HMAC_SECRET: ${{ secrets.SESSION_HMAC_SECRET }}
          PIN_SALT: crypto-trader-v1
        run: |
          set -euo pipefail
          MODE="${{ vars.TRADER_MODE }}"
          MODE="${MODE:-dry-run}"
          if [ "$MODE" = "live" ]; then
            echo "job_arg1=main.py" >> "$GITHUB_OUTPUT"
            echo "job_arg2=run" >> "$GITHUB_OUTPUT"
          else
            echo "job_arg1=main.py" >> "$GITHUB_OUTPUT"
            echo "job_arg2=dry-run" >> "$GITHUB_OUTPUT"
          fi
          echo "trader_mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ -z "${TRADER_CONTROL_PIN:-}" ]; then
            echo "CONTROL_PIN_HASH missing — set GitHub secret TRADER_CONTROL_PIN" >&2
            exit 1
          fi
          # Salted SHA-256; strip whitespace + full-width digits; never echo the PIN
          HASH=$(python3 -c "import hashlib,os; salt=os.environ['PIN_SALT']; raw=os.environ.get('TRADER_CONTROL_PIN') or ''; s=raw.strip(); pin=''.join(chr(ord(c)-0xFF10+ord('0')) if 0xFF10<=ord(c)<=0xFF19 else c for c in s); print(hashlib.sha256((salt+pin).encode()).hexdigest())")
          echo "pin_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "pin_hash_len=${#HASH}"
          # Prefer explicit SESSION_HMAC_SECRET (rotated independently); else derive from pin hash
          if [ -n "${SESSION_HMAC_SECRET:-}" ]; then
            SESS="$SESSION_HMAC_SECRET"
          else
            SESS=$(HASH="$HASH" PIN_SALT="$PIN_SALT" python3 -c "import hashlib,os; print(hashlib.sha256(('session-v1|'+os.environ['PIN_SALT']+'|'+os.environ['HASH']).encode()).hexdigest())")
          fi
          echo "session_secret=$SESS" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run Job
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          RUNTIME_SA="trader-runtime@${PROJECT}.iam.gserviceaccount.com"
          BUCKET="${{ vars.GCS_BUCKET }}"
          ENABLED="${{ vars.TRADER_ENABLED }}"
          ENABLED="${ENABLED:-true}"
          MODE="${{ steps.mode.outputs.trader_mode }}"

          gcloud run jobs deploy "${JOB_NAME}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}" \
            --service-account="${RUNTIME_SA}" \
            --task-timeout=600 \
            --max-retries=1 \
            --set-env-vars="GCS_BUCKET=${BUCKET},TRADER_MODE=${MODE},TRADER_ENABLED=${ENABLED},BINANCE_BASE_URL=https://demo-api.binance.com,BINANCE_FUTURES_DEMO_BASE_URL=https://demo-fapi.binance.com,VISION_BASE_URL=https://data-api.binance.vision" \
            --set-secrets="BINANCE_DEMO_API_KEY=BINANCE_DEMO_API_KEY:latest,BINANCE_DEMO_API_SECRET=BINANCE_DEMO_API_SECRET:latest" \
            --command=python \
            --args=-u,${{ steps.mode.outputs.job_arg1 }},${{ steps.mode.outputs.job_arg2 }} \
            --memory=512Mi \
            --cpu=1

      - name: Deploy Cloud Run Service (status/control API)
        id: svc
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          RUNTIME_SA="trader-runtime@${PROJECT}.iam.gserviceaccount.com"
          BUCKET="${{ vars.GCS_BUCKET }}"
          ENABLED="${{ vars.TRADER_ENABLED }}"
          ENABLED="${ENABLED:-true}"
          MODE="${{ steps.mode.outputs.trader_mode }}"
          PIN_HASH="${{ steps.mode.outputs.pin_hash }}"
          SESS_SECRET="${{ steps.mode.outputs.session_secret }}"

          gcloud run deploy "${SERVICE_NAME}" \
            --project="${PROJECT}" \
            --region="${REGION}" \
            --image="${IMAGE_URI}" \
            --service-account="${RUNTIME_SA}" \
            --allow-unauthenticated \
            --port=8080 \
            --command=python \
            --args=-u,api.py \
            --set-env-vars="GCS_BUCKET=${BUCKET},TRADER_MODE=${MODE},TRADER_ENABLED=${ENABLED},BINANCE_BASE_URL=https://demo-api.binance.com,BINANCE_FUTURES_DEMO_BASE_URL=https://demo-fapi.binance.com,VISION_BASE_URL=https://data-api.binance.vision,CORS_ORIGIN=${CORS_ORIGIN},CONTROL_PIN_SALT=${PIN_SALT},CONTROL_PIN_HASH=${PIN_HASH},SESSION_HMAC_SECRET=${SESS_SECRET}" \
            --set-secrets="BINANCE_DEMO_API_KEY=BINANCE_DEMO_API_KEY:latest,BINANCE_DEMO_API_SECRET=BINANCE_DEMO_API_SECRET:latest" \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=60

          URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project="${PROJECT}" --region="${REGION}" \
            --format='value(status.url)')
          echo "service_url=$URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$URL" >> "$GITHUB_ENV"
          echo "Deployed API at $URL"

      - name: Ensure hourly Cloud Scheduler (satellites + windowed SOL check)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          RUNTIME_SA="trader-runtime@${PROJECT}.iam.gserviceaccount.com"
          URI="https://run.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/jobs/${JOB_NAME}:run"

          gcloud run jobs add-iam-policy-binding "${JOB_NAME}" \
            --project="${PROJECT}" --region="${REGION}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/run.invoker" || true

          if gcloud scheduler jobs describe "${SCHEDULER_HOURLY}" --location="${REGION}" --project="${PROJECT}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${SCHEDULER_HOURLY}" \
              --project="${PROJECT}" --location="${REGION}" \
              --schedule="1 * * * *" --time-zone="UTC" \
              --uri="${URI}" --http-method=POST \
              --oauth-service-account-email="${RUNTIME_SA}" --message-body="{}"
          else
            gcloud scheduler jobs create http "${SCHEDULER_HOURLY}" \
              --project="${PROJECT}" --location="${REGION}" \
              --schedule="1 * * * *" --time-zone="UTC" \
              --uri="${URI}" --http-method=POST \
              --oauth-service-account-email="${RUNTIME_SA}" --message-body="{}"
          fi

      - name: Ensure daily SOL scheduler (UTC 00:07 ≈ Taipei 08:07)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          RUNTIME_SA="trader-runtime@${PROJECT}.iam.gserviceaccount.com"
          URI="https://run.googleapis.com/v2/projects/${PROJECT}/locations/${REGION}/jobs/${JOB_NAME}:run"
          if gcloud scheduler jobs describe "${SCHEDULER_DAILY_SOL}" --location="${REGION}" --project="${PROJECT}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${SCHEDULER_DAILY_SOL}" \
              --project="${PROJECT}" --location="${REGION}" \
              --schedule="7 0 * * *" --time-zone="UTC" \
              --uri="${URI}" --http-method=POST \
              --oauth-service-account-email="${RUNTIME_SA}" --message-body="{}"
          else
            gcloud scheduler jobs create http "${SCHEDULER_DAILY_SOL}" \
              --project="${PROJECT}" --location="${REGION}" \
              --schedule="7 0 * * *" --time-zone="UTC" \
              --uri="${URI}" --http-method=POST \
              --oauth-service-account-email="${RUNTIME_SA}" --message-body="{}"
          fi

      - name: Execute probe once
        if: ${{ inputs.run_probe }}
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT}" --region="${REGION}" \
            --args=main.py,probe --wait


      - name: Execute futures-order-probe once
        if: ${{ inputs.run_futures_order_probe }}
        id: fut_order_probe
        continue-on-error: true
        run: |
          set -uo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          set +e
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT}" --region="${REGION}" \
            --args=main.py,futures-order-probe --wait
          EC=$?
          set -e
          echo "exit_code=${EC}" >> "$GITHUB_OUTPUT"
          EXEC=$(gcloud run jobs executions list --job="${JOB_NAME}" --project="${PROJECT}" --region="${REGION}" --limit=1 --format='value(name)')
          echo "execution=${EXEC}"
          if [ -n "${EXEC}" ]; then
            gcloud run jobs executions describe "${EXEC}" --project="${PROJECT}" --region="${REGION}" \
              --format='yaml(status)' || true
          fi
          echo "--- futures-order-probe exit=${EC} ---"
          exit ${EC}


      - name: Execute futures-probe once
        if: ${{ inputs.run_futures_probe }}
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT}" --region="${REGION}" \
            --args=main.py,futures-probe --wait
          echo "--- futures-probe logs ---"
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
            --project="${PROJECT}" --limit=30 \
            --format='value(textPayload)' || true

      - name: Execute job once (live/dry-run per TRADER_MODE)
        if: ${{ inputs.run_once }}
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          gcloud run jobs execute "${JOB_NAME}" \
            --project="${PROJECT}" --region="${REGION}" \
            --wait
          echo "--- recent job logs ---"
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME}" \
            --project="${PROJECT}" --limit=40 \
            --format='value(textPayload)' || true

      - name: Summary
        run: |
          echo "### Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`${{ steps.mode.outputs.trader_mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.svc.outputs.service_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_URI}\`" >> "$GITHUB_STEP_SUMMARY"
