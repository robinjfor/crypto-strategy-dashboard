<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>策略明細 · Binance Demo</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./home.css" />
  <link rel="stylesheet" href="./redesign.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">☰</div><div><h1>策略明細</h1><div class="sub">Demo · 只讀</div></div></div>
      <nav class="nav-links" aria-label="主選單">
        <a class="nav-link" href="./">總覽</a>
        <a class="nav-link" href="./risk.html">風險</a>
        <a class="nav-link active" href="./strategy.html">策略明細</a>
        <a class="nav-link" href="./credibility.html">回測可信度</a>
        <a class="nav-link" href="./gate.html">實盤門檻</a>
        <a class="nav-link" href="./review.html">外部審閱</a>
      </nav>
    </header>
    <div class="err-banner" id="errBanner"></div>
    <main id="main" class="loading">載入中…</main>
  </div>
  <script src="./nav.js"></script>
  <script>
  (async function () {
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const show = (v) => (v == null || v === "" || v === "missing" ? "缺值" : esc(v));
    async function apiBase() {
      const b = window.TraderAuth && TraderAuth.getApiBase && TraderAuth.getApiBase();
      if (b) return b;
      const cfg = await fetch("./data/cloud_api.json").then((r) => r.json());
      return String(cfg.base || "").replace(/\/$/, "");
    }
    if (!window.TraderAuth || !TraderAuth.getToken()) { $("main").textContent = "請先登入"; return; }
    const code = (new URLSearchParams(location.search).get("code") || "E5").toUpperCase();
    try {
      const base = await apiBase();
      const res = await fetch(base + "/review/strategy?code=" + encodeURIComponent(code), {
        headers: { Authorization: "Bearer " + TraderAuth.getToken() }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "讀取失敗");
      const f = data.footer || {};
      const pnl = (v) => (window.TraderAuth && TraderAuth.pnlHtml ? TraderAuth.pnlHtml(v) : show(v));
      const cost = (data.fees === "缺值" || data.funding === "缺值") ? '<span class="tag warn">未完整扣成本</span>' : "";
      const codes = ["E5", "VBO", "R2S", "FA", "U1"].map((c) => '<a class="' + (c === data.code ? "on" : "") + '" href="./strategy.html?code=' + c + '">' + c + "</a>").join("");
      const warn = f.unallocated_usdt_warning && f.unallocated_usdt_warning.show
        ? '<p style="color:#fcd34d">' + esc(f.unallocated_usdt_warning.label_zh || "") + " " + show(f.unallocated_usdt_warning.amount) + "</p>"
        : "";
      $("main").className = "";
      $("main").innerHTML = '<nav class="score-subnav" aria-label="策略">' + codes + "</nav>"
        + '<section class="section"><div class="card"><div class="card-body">'
        + "<h2>" + esc(data.code) + " · " + esc(data.slot) + " " + cost + "</h2>"
        + '<div class="kpi-row">'
        + '<div class="h-kpi"><div class="l">權益 <span class="info-mark">ⓘ</span></div><div class="v">' + show(data.equity_display) + '</div><div class="s">來源：GET /review/strategy。資料時間：' + show(data.as_of) + "。環境 demo。</div></div>"
        + '<div class="h-kpi"><div class="l">淨損益</div><div class="v">' + pnl(data.net_pnl) + "</div></div>"
        + '<div class="h-kpi"><div class="l">資金基準</div><div class="v">' + show(data.strategy_capital_basis) + '</div><div class="s">' + esc(data.strategy_capital_basis_label === "orchestrator_target" ? "編排目標" : "虛擬本金") + "</div></div>"
        + '<div class="h-kpi"><div class="l">權重</div><div class="v">' + show(data.weight_display) + "</div></div>"
        + "</div>"
        + "<p>版本 " + show(data.version_display) + "。已實現 " + pnl(data.realized) + "。未實現 " + pnl(data.unrealized)
        + "。手續費 " + show(data.fees) + "。資金費 " + show(data.funding) + "。</p>"
        + "<p>三十日周轉 " + show(data.turnover_30d) + "。筆數 " + show(data.n_trades)
        + "。開始 " + show(data.start) + "。結束 " + show(data.end) + "。</p>"
        + '<p class="' + (f.bridge_diff_red ? "neg" : "") + '">' + esc(f.text_zh || "") + "： "
        + show(f.sum_strategy_equity) + " + " + show(f.unallocated_cash) + " + " + pnl(f.bridge_diff)
        + " = " + show(f.nav) + "。差額不自動抹平。</p>"
        + warn
        + '<p class="readonly-note">只讀。沒有下單、槓桿、配置或暫停按鈕。</p>'
        + "</div></div></section>";
    } catch (e) {
      $("errBanner").textContent = e.message || String(e);
      $("main").textContent = "載入失敗";
    }
  })();
  </script>
</body>
</html>
