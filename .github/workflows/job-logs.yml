# Manual only. READ-ONLY: prints state.json demo_candidates[slot] and a shadow_ab GCS object (no secrets in either).
name: job-logs

on:
  workflow_dispatch:
    inputs:
      slot: { description: "demo_candidates slot id", required: true, default: "demo_e5_min5_x175" }
      shadow_obj: { description: "object under trader/shadow_ab/ to print (e.g. parity_E5.json)", required: false, default: "parity_E5.json" }

permissions:
  contents: read
  id-token: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read gate state (read-only)
        env:
          SLOT: ${{ inputs.slot }}
          OBJ: ${{ inputs.shadow_obj }}
        run: |
          set -uo pipefail
          B="${{ vars.GCS_BUCKET }}"
          gcloud storage cat "gs://${B}/trader/state.json" > /tmp/s.json
          python3 -c "import json,os;d=json.load(open('/tmp/s.json'));print(json.dumps((d.get('demo_candidates') or {}).get(os.environ['SLOT']),indent=1,default=str)[:20000]);print([e for e in (d.get('control_log') or []) if e.get('slot')==os.environ['SLOT']][-20:])"
          python3 -c "import json;d=json.load(open('/tmp/s.json'));print('demo_r2s_exec',json.dumps(d.get('demo_r2s_exec'),default=str)[:6000])"
          gcloud logging read 'resource.type=cloud_run_job AND resource.labels.job_name=crypto-trader-reconcile AND (textPayload:"r2s" OR jsonPayload.message:"r2s") AND timestamp>="'"$(date -u -d '-12 hours' +%FT%TZ)"'"' --project="${{ vars.GCP_PROJECT_ID }}" --order=asc --limit=80 --format='value(timestamp,textPayload,jsonPayload.message)' | cut -c1-1500 || true
          [ -n "${OBJ}" ] && gcloud storage cat "gs://${B}/trader/shadow_ab/${OBJ}" | head -c 300000 | fold -w 3000 || true
