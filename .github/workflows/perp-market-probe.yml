# Manual only. READ-ONLY check that the asia-east1 Cloud Run job can reach public fapi.binance.com
# (perp klines + funding for the S family). Per-execution override; does not modify the job.
# Public GET requests only; no keys used, no orders, no state writes.
name: perp-market-probe

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-east1
  JOB_NAME: crypto-trader

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Execute read-only perp market probe (per-execution override)
        run: |
          set -euo pipefail
          PROJECT="${{ vars.GCP_PROJECT_ID }}"
          B64=$(base64 -w0 scripts/perp_market_probe_readonly.py)
          EX=$(gcloud run jobs execute "${JOB_NAME}" --project="${PROJECT}" --region="${REGION}" \
            --args='^|^-c|exec(__import__("base64").b64decode(__import__("os").environ["PROBE_B64"]).decode())' \
            --update-env-vars="^@^PROBE_B64=${B64}" --wait --format='value(metadata.name)')
          echo "execution=${EX}"
          sleep 20
          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=${JOB_NAME} AND labels.\"run.googleapis.com/execution_name\"=${EX}" \
            --project="${PROJECT}" --limit=50 --format='value(textPayload)' | grep -E "PERP_PROBE|Error|Traceback" || true
