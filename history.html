<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>成交歷史 · Binance Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">⚡</div>
        <div>
          <h1>成交歷史</h1>
          <div class="sub">Binance Demo 帳戶（真實成交）· 僅顯示 Demo 來源</div>
        </div>
      </div>
      <nav class="nav-links" aria-label="主選單">
        <a class="nav-link" href="./">帳戶總覽</a>
        <a class="nav-link active" href="./history.html">成交歷史</a>
        <a class="nav-link" href="./watchlist.html">追蹤名單</a>
        <a class="nav-link" href="./backtest.html">回測績效</a>
      </nav>
    </header>
    <div class="err-banner hidden" id="errBanner"></div>
    <main id="main" class="loading">載入中…</main>
  </div>
  <script src="./exit-reasons.js"></script>
  <script>
  (async function () {
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const num = (v, d) => (v == null || Number.isNaN(Number(v))) ? "—" : Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
    const reason = (c) => (typeof window.reasonZh === "function" ? window.reasonZh(c) : (c || "—"));
    try {
      let rows = [];
      try {
        const arr = await (await fetch("./data/strategy-crypto-s2/settlement.json?t="+Date.now(),{cache:"no-store"})).json();
        if (Array.isArray(arr)) rows = arr;
      } catch (_) {
        const text = await (await fetch("./state/settlement.jsonl?t="+Date.now(),{cache:"no-store"})).text();
        rows = text.trim().split("\n").filter(Boolean).map((l) => JSON.parse(l));
      }
      rows = rows.filter((r) => {
        const s = String(r.symbol || "").toUpperCase();
        return !s.includes("OPUSDT") && !s.includes("FILUSDT") && s !== "OP" && s !== "FIL";
      }).sort((a,b) => String(b.ts||"").localeCompare(String(a.ts||"")));
      const body = rows.length ? rows.map((r) => {
        const kind = r.kind || "—";
        const side = r.side || (String(kind).toUpperCase()==="OPEN"?"BUY":String(kind).toUpperCase()==="CLOSE"?"SELL":"—");
        const pnl = r.realized_pnl_usdt != null ? r.realized_pnl_usdt : r.pnl_usdt;
        const cls = pnl > 0 ? "pos" : pnl < 0 ? "neg" : "";
        return `<tr>
          <td>${esc(r.ts||"—")}</td><td>${esc(kind)}</td><td><strong>${esc(r.symbol||"—")}</strong></td>
          <td>${esc(side)}</td><td class="num">${num(r.qty,4)}</td><td class="num">${num(r.price,4)}</td>
          <td class="num">${r.fee==null?"—":num(r.fee,4)}</td>
          <td class="num ${cls}">${pnl==null?"—":num(pnl,2)}</td>
          <td>${esc(reason(r.reason||kind))}</td>
          <td>${esc(r.source||"—")}</td>
        </tr>`;
      }).join("") : `<tr><td colspan="10" class="empty-row">尚無成交</td></tr>`;
      $("main").className = "";
      $("main").innerHTML = `<section class="section">
        <div class="section-head"><h2>完整成交歷史</h2><span class="hint">${rows.length} 筆 · Binance Demo</span></div>
        <div class="card"><div class="table-scroll"><table class="data">
          <thead><tr><th>時間</th><th>類型</th><th>標的</th><th>方向</th><th class="num">數量</th><th class="num">價格</th><th class="num">手續費</th><th class="num">已實現損益</th><th>原因</th><th>來源</th></tr></thead>
          <tbody>${body}</tbody>
        </table></div></div>
      </section>`;
    } catch (e) {
      $("errBanner").textContent = "載入失敗：" + e.message;
      $("errBanner").classList.remove("hidden");
      $("main").textContent = "載入失敗";
    }
  })();
  </script>
</body>
</html>
