# Manual, read-only: aggregate Cloud Run request logs for auth diagnostics.
# Public repo → never print raw IPs/tokens; IPs are salted-hashed.
name: trader-auth-logs

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Freshness window for gcloud logging read (e.g. 16h)"
        type: string
        default: "16h"

permissions:
  contents: read
  id-token: write

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA_EMAIL }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Aggregate /auth/login and /status request logs
        env:
          SALT: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="crypto-trader-api" AND httpRequest.requestUrl:("/auth/login" OR "/status" OR "/approved" OR "/control")' \
            --project="${{ vars.GCP_PROJECT_ID }}" --freshness="${{ inputs.since }}" --limit=20000 --format=json > req.json
          python3 - <<'PY'
          import json, hashlib, os, collections, datetime
          salt = os.environ["SALT"]
          rows = json.load(open("req.json"))
          tz = datetime.timezone(datetime.timedelta(hours=8))
          agg = collections.Counter(); first = {}
          for r in rows:
              h = r.get("httpRequest") or {}
              url = h.get("requestUrl") or ""
              path = "/" + url.split("://", 1)[-1].split("/", 1)[-1].split("?")[0] if "://" in url else url
              ip = h.get("remoteIp") or "?"
              iph = hashlib.sha256((salt + ip).encode()).hexdigest()[:8]
              ua = (h.get("userAgent") or "")
              uac = ("python" if "python" in ua.lower() else "curl" if "curl" in ua.lower() else
                     "headless" if "headless" in ua.lower() else "browser" if "mozilla" in ua.lower() else (ua[:20] or "-"))
              ts = r.get("timestamp", "")[:19]
              try:
                  t = datetime.datetime.fromisoformat(ts).replace(tzinfo=datetime.timezone.utc).astimezone(tz)
                  hr = t.strftime("%m-%d %H:00")
              except Exception:
                  hr = "?"
              k = (hr, h.get("requestMethod"), path, h.get("status"), iph, uac)
              agg[k] += 1
          print(f"total requests: {len(rows)}")
          print("hour(TPT) | method | path | status | ip#hash | ua | count")
          for k in sorted(agg):
              print(" | ".join(str(x) for x in k), "|", agg[k])
          PY
